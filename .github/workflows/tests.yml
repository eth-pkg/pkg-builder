name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup sbuild
        uses: ./.github/actions/setup-sbuild

      - name: Build
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --lib --verbose -- --ignored

  bookworm:
    strategy:
      matrix:
        language:
          - c
          # - dotnet
          # - go
          # - java
          # - java-gradle
          # - javascript
          # - nim
          # - python
          # - rust
          # - typescript
          # - virtual
      max-parallel: 3
      fail-fast: false
    uses: ./.github/workflows/packaging.yml
    with:
      distro: bookworm
      language: ${{ matrix.language }}

  trixie:
    strategy:
      matrix:
        language:
          - c
          # - dotnet
          # - go
          # - java
          # - java-gradle
          # - javascript
          # - nim
          # - python
          # - rust
          # - typescript
          # - virtual
      max-parallel: 3
      fail-fast: false
    uses: ./.github/workflows/packaging.yml
    with:
      distro: trixie
      language: ${{ matrix.language }}

  noble:
    strategy:
      matrix:
        language:
          - c
          # - dotnet
          # - dotnet-9
          # - go
          # - java
          # - java-gradle
          # - javascript
          # - nim
          # - python
          # - rust
          # - typescript
          # - virtual
      max-parallel: 3
      fail-fast: false
    uses: ./.github/workflows/packaging.yml
    with:
      distro: noble
      language: ${{ matrix.language }}
      include_genisoimage: true

