name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup sbuild
        uses: ./.github/actions/setup-sbuild

      - name: Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

  package:
    runs-on: ubuntu-24.04
    needs: unit-tests
    strategy:
      matrix:
        include:
          # Bookworm
          - { distro: bookworm, language: c }
          - { distro: bookworm, language: go }
          - { distro: bookworm, language: java }
          - { distro: bookworm, language: java-gradle }
          - { distro: bookworm, language: javascript }
          - { distro: bookworm, language: nim }
          - { distro: bookworm, language: rust }
          - { distro: bookworm, language: typescript }
          - { distro: bookworm, language: virtual }
          # Trixie
          - { distro: trixie, language: c }
          - { distro: trixie, language: go }
          - { distro: trixie, language: java }
          - { distro: trixie, language: java-gradle }
          - { distro: trixie, language: javascript }
          - { distro: trixie, language: nim }
          - { distro: trixie, language: rust }
          - { distro: trixie, language: typescript }
          - { distro: trixie, language: virtual }
          # Noble
          - { distro: noble, language: c }
          - { distro: noble, language: go }
          - { distro: noble, language: java }
          - { distro: noble, language: java-gradle }
          - { distro: noble, language: javascript }
          - { distro: noble, language: nim }
          - { distro: noble, language: rust }
          - { distro: noble, language: typescript }
          - { distro: noble, language: virtual }
      max-parallel: 6
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Setup sbuild
        uses: ./.github/actions/setup-sbuild

      - name: Noble-specific setup
        if: matrix.distro == 'noble'
        run: |
          sudo apt-get install -y genisoimage
          sudo sysctl -w kernel.unprivileged_userns_clone=1

      - name: Build and install pkg-builder
        run: |
          cargo build --release --locked
          mkdir -p ${HOME}/.local/bin
          cp target/release/pkg-builder ${HOME}/.local/bin/
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Create chroot
        working-directory: examples/${{ matrix.distro }}/${{ matrix.language }}/hello-world
        run: pkg-builder env create

      - name: Build package
        working-directory: examples/${{ matrix.distro }}/${{ matrix.language }}/hello-world
        run: pkg-builder build

      - name: Verify hashes
        working-directory: examples/${{ matrix.distro }}/${{ matrix.language }}/hello-world
        run: pkg-builder verify
