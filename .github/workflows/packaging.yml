name: Packaging

on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      languages:
        required: true
        type: string
      include_genisoimage:
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - id: parse
        run: |
          matrix=$(printf '%s' '${{ inputs.languages }}' | \
            grep -v '^[[:space:]]*$' | \
            sed 's/^[[:space:]]*-[[:space:]]*//' | \
            jq -R . | jq -sc .)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  package:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        language: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-packaging-env
        with:
          include_genisoimage: ${{ inputs.include_genisoimage }}

      - name: Additional noble setup
        if: inputs.distro == 'noble'
        shell: bash
        run: |
          sudo sbuild-adduser `whoami`
          sudo sysctl -w kernel.unprivileged_userns_clone=1

      - name: Create chroot env
        run: |
          cd examples/${{ inputs.distro }}/${{ matrix.language }}/hello-world
          pkg-builder --install-deps env create
          echo "${HOME}/.cache/sbuild/${{ inputs.distro }}-amd64.tar.gz" >> $GITHUB_PATH

      - name: Run packaging tests
        uses: ./.github/actions/run-packaging-tests
        with:
          distro: ${{ inputs.distro }}
          language: ${{ matrix.language }}
